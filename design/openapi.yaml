components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Erro:
      type: object
      properties:
        error:
          type: string
          description: Mensagem em português
        fields:
          type: object
          description: Erros por campo (validação)
      required:
        - error
  responses:
    Erro:
      description: Requisição inválida ou registro não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    NaoAutenticado:
      description: Token ausente, inválido ou sessão expirada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'
    SemPermissao:
      description: Sem permissão para o módulo ou a ação
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Erro'

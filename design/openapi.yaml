# Gerado por backend/scripts/openapi.js (npm run openapi) — não edite à mão.
openapi: 3.0.3
info:
  title: Sistema DA — Diretoria Administrativa da Câmara Municipal
  version: 1.0.0
  description: >-
    API do Sistema DA (Node.js/Express + PostgreSQL). Gerado por `npm run openapi` a partir das rotas registradas — não edite à mão.


    Autenticação: `Authorization: Bearer <token>` obtido em `POST /api/auth/login`. A sessão expira por inatividade (Configurações › Geral).
    Toda autorização é validada no servidor: rota de módulo sem acesso devolve 403 e é registrada na auditoria. Erros 500 não expõem
    detalhes internos.
servers:
  - url: http://localhost:3000
    description: Desenvolvimento
security:
  - bearerAuth: []
tags:
  - name: Autenticação
  - name: Perfil
  - name: Usuários
  - name: Auditoria
  - name: Configurações
  - name: Cadastros
  - name: Painel
  - name: Gestão de Pessoal
  - name: Compras & Licitações
  - name: Almoxarifado
  - name: Patrimônio
  - name: Protocolo
  - name: Moções & Homenagens
  - name: Legislações
  - name: Notificações
  - name: Analytics
paths:
  /health:
    get:
      tags:
        - Sistema
      summary: Verificação de saúde do serviço
      description: '{ ok: true }'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
      security: []
  /api/auth/login:
    post:
      tags:
        - Autenticação
      summary: Login com usuário (ou matrícula) e senha
      description: Token JWT e dados do usuário. 401 com tentativas restantes; 423 quando bloqueado.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                password:
                  type: string
              required:
                - username
                - password
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
      security: []
  /api/auth/me:
    get:
      tags:
        - Autenticação
      summary: Usuário autenticado, perfis, módulos e preferências
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/auth/logout:
    post:
      tags:
        - Autenticação
      summary: Encerra a sessão atual (revoga o token)
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/auth/password-rules:
    get:
      tags:
        - Autenticação
      summary: Regras de senha vigentes (Configurações › Segurança)
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
      security: []
  /api/auth/forgot-password:
    post:
      tags:
        - Autenticação
      summary: Solicita redefinição de senha (resposta sempre genérica)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
              required:
                - email
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
      security: []
  /api/auth/reset-password:
    post:
      tags:
        - Autenticação
      summary: Redefine a senha com token de uso único (30 min) ou convite
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token:
                  type: string
                password:
                  type: string
              required:
                - token
                - password
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
      security: []
  /api/auth/password:
    put:
      tags:
        - Autenticação
      summary: Troca a própria senha (exige a atual; devolve novo token)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                currentPassword:
                  type: string
                newPassword:
                  type: string
              required:
                - currentPassword
                - newPassword
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/auth/preferences:
    put:
      tags:
        - Autenticação
      summary: Salva preferências do usuário (tema, exercício fiscal)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                theme:
                  type: string
                exercicio:
                  type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/profile/:
    get:
      tags:
        - Perfil
      summary: Dados do próprio perfil
      description: 'Acesso: módulo `perfil` (403 sem permissão).'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    put:
      tags:
        - Perfil
      summary: Atualiza telefone, e-mail pessoal e aniversário. Nome, matrícula, cargo e e-mail institucional → 403
      description: 'Acesso: módulo `perfil` (403 sem permissão).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                phone:
                  type: string
                personalEmail:
                  type: string
                birthday:
                  type: string
                  format: date
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/users/:
    get:
      tags:
        - Usuários
      summary: Lista usuários com perfis e permissões (leitura registrada — LGPD)
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    post:
      tags:
        - Usuários
      summary: Cria usuário e envia convite por e-mail
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                registration:
                  type: string
                position:
                  type: string
                hierarchy:
                  type: string
                department:
                  type: string
                roles:
                  type: array
                  items: {}
              required:
                - name
                - email
                - registration
                - roles
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/users/history:
    get:
      tags:
        - Usuários
      summary: Histórico de alterações de acesso
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/users/{id}:
    put:
      tags:
        - Usuários
      summary: Edita dados cadastrais do usuário
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                email:
                  type: string
                registration:
                  type: string
                position:
                  type: string
                hierarchy:
                  type: string
                department:
                  type: string
              required:
                - name
                - email
                - registration
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/Erro'
  /api/users/{id}/roles:
    put:
      tags:
        - Usuários
      summary: Define os perfis (vários por usuário); protege o último Administrativo
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                roles:
                  type: array
                  items: {}
              required:
                - roles
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/Erro'
  /api/users/{id}/access/{module}:
    put:
      tags:
        - Usuários
      summary: Exceção de acesso a um módulo (sobrepõe o perfil)
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: module
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                allowed:
                  type: boolean
              required:
                - allowed
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/Erro'
    delete:
      tags:
        - Usuários
      summary: Remove a exceção de acesso (volta ao perfil)
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
        - name: module
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/Erro'
  /api/users/{id}/invite:
    post:
      tags:
        - Usuários
      summary: Reenvia o convite de primeiro acesso
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/Erro'
  /api/audit/:
    get:
      tags:
        - Auditoria
      summary: Log de auditoria com filtros e indicadores
      description: 'Acesso: módulo `auditoria` (403 sem permissão).'
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: module
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/audit/export.csv:
    get:
      tags:
        - Auditoria
      summary: Exporta o log filtrado (CSV; exportação auditada)
      description: 'Acesso: módulo `auditoria` (403 sem permissão).'
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: module
          in: query
          required: false
          schema:
            type: string
        - name: level
          in: query
          required: false
          schema:
            type: string
        - name: period
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Arquivo CSV (UTF-8 com BOM, separador ;)
          content:
            text/csv:
              schema:
                type: string
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/config/:
    get:
      tags:
        - Configurações
      summary: Parâmetros do sistema por aba (esquema + valores)
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/config/values/{key}:
    put:
      tags:
        - Configurações
      summary: Altera um parâmetro (validado pelo esquema; auditado)
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value:
                  type: object
              required:
                - value
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/Erro'
  /api/config/reset/{tab}:
    post:
      tags:
        - Configurações
      summary: Restaura os padrões de uma aba
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      parameters:
        - name: tab
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/Erro'
  /api/config/access:
    get:
      tags:
        - Configurações
      summary: Matriz perfil × módulo
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    put:
      tags:
        - Configurações
      summary: Liga/desliga um módulo para um perfil (auditado)
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                module:
                  type: string
                'on':
                  type: boolean
              required:
                - role
                - module
                - 'on'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/config/access/reset:
    post:
      tags:
        - Configurações
      summary: Restaura a matriz padrão
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/cost-centers:
    get:
      tags:
        - Cadastros
      summary: Centros de custo (padrão ou patrimônio)
      parameters:
        - name: tipo
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    post:
      tags:
        - Cadastros
      summary: Cadastra centro de custo
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codigo:
                  type: string
                nome:
                  type: string
                tipo:
                  type: string
              required:
                - codigo
                - nome
                - tipo
      responses:
        '201':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
  /api/cost-centers/{id}:
    put:
      tags:
        - Cadastros
      summary: Edita centro de custo
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                codigo:
                  type: string
                nome:
                  type: string
                tipo:
                  type: string
              required:
                - codigo
                - nome
                - tipo
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/Erro'
  /api/cost-centers/{id}/active:
    patch:
      tags:
        - Cadastros
      summary: Ativa/inativa centro de custo
      description: 'Acesso: perfil Administrativo (403 sem permissão).'
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                ativo:
                  type: boolean
              required:
                - ativo
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
        '404':
          $ref: '#/components/responses/Erro'
  /api/vereadores:
    get:
      tags:
        - Cadastros
      summary: Vereadores ativos (autores de moções e homenagens)
      responses:
        '200':
          description: Sucesso
          content:
            application/json:
              schema:
                type: object
        '400':
          $ref: '#/components/responses/Erro'
        '401':
          $ref: '#/components/responses/NaoAutenticado'
        '403':
          $ref: '#/components/responses/SemPermissao'
    post:
      tags:
        - Cadastros
      summary: Cadastra vereador
      description: 'Acesso: módulo `mocoes ou configuracoes` (403 sem permissão).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
